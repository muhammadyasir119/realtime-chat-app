<!DOCTYPE html>
<html>
<head>
    <title>Real-Time Chat App</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0e1117; color: #fff; padding: 20px; }
        #chat { border: 1px solid #30363d; background: #161b22; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        input, button { padding: 10px; font-size: 16px; border-radius: 5px; border: none; }
        input { width: 70%; background: #0d1117; color: #fff; border: 1px solid #30363d; }
        button { background: #238636; color: white; cursor: pointer; }
        button:hover { background: #2ea043; }
        ul { list-style-type: none; padding: 0; }
        li { background: #21262d; margin-top: 5px; padding: 8px; border-radius: 4px; }
    </style>
</head>
<body>
    <h2>Python Real-Time Chat App</h2>
    <h3>Your ID: <span id="ws-id"></span></h3>
    <form action="" onsubmit="sendMessage(event)">
        <input type="text" id="messageText" autocomplete="off" placeholder="Type a message..." />
        <button>Send</button>
    </form>
    <ul id='messages'></ul>

    <script>
        const client_id = Date.now().toString().slice(-4);
        document.querySelector("#ws-id").textContent = client_id;
        const ws = new WebSocket(`ws://localhost:8000/ws/${client_id}`);

        ws.onmessage = function(event) {
            const messages = document.getElementById('messages')
            const message = document.createElement('li')
            const content = document.createTextNode(event.data);
            message.appendChild(content)
            messages.appendChild(message)
        };

        function sendMessage(event) {
            const input = document.getElementById("messageText")
            ws.send(input.value)
            input.value = ''
            event.preventDefault()
        }
    </script>
</body>
</html>
